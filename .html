<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Premium</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons para ícones bonitos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #e6f4ea; /* Fundo verde claro agradável */
        }

        .grid-cell {
            transition: all 0.2s ease-in-out;
        }

        .grid-cell:hover:not(.occupied) {
            background-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }

        /* Efeito de brilho para a linha vencedora */
        .winning-cell {
            animation: pulse-green 1.5s infinite alternate;
        }

        @keyframes pulse-green {
            0% {
                background-color: #bbf7d0;
                box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            }
            100% {
                background-color: #86efac;
                box-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Cabeçalho / Título -->
    <header class="text-center my-4 w-full max-w-md">
        <h1 class="text-4xl font-extrabold text-emerald-800 tracking-tight flex items-center justify-center gap-2">
            <i data-lucide="gamepad-2" class="w-10 h-10 text-emerald-600"></i>
            Jogo da Velha
        </h1>
        <p class="text-emerald-700 font-medium mt-1">Divirta-se jogando solo ou com amigos!</p>
    </header>

    <!-- Painel de Controle e Status -->
    <main class="w-full max-w-md flex flex-col items-center gap-6">
        
        <!-- Seleção de Modo de Jogo e Placar -->
        <div class="bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-md w-full flex flex-col gap-4 border border-emerald-100">
            <!-- Modos -->
            <div class="flex bg-emerald-100 p-1 rounded-xl">
                <button id="btn-pvp" class="flex-1 py-2 text-sm font-semibold rounded-lg text-emerald-800 bg-white shadow transition-all duration-200 flex items-center justify-center gap-1">
                    <i data-lucide="users" class="w-4 h-4"></i> 2 Jogadores
                </button>
                <button id="btn-ai" class="flex-1 py-2 text-sm font-semibold rounded-lg text-emerald-700 hover:text-emerald-800 transition-all duration-200 flex items-center justify-center gap-1">
                    <i data-lucide="cpu" class="w-4 h-4"></i> Contra IA
                </button>
            </div>

            <!-- Placar de Pontos -->
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-blue-50 p-2 rounded-xl border border-blue-100">
                    <div class="text-xs font-semibold text-blue-600 uppercase">Jogador X</div>
                    <div id="score-x" class="text-xl font-bold text-blue-800">0</div>
                </div>
                <div class="bg-gray-50 p-2 rounded-xl border border-gray-100 flex flex-col justify-center">
                    <div class="text-xs font-semibold text-gray-500 uppercase">Velhas</div>
                    <div id="score-ties" class="text-xl font-bold text-gray-700">0</div>
                </div>
                <div class="bg-rose-50 p-2 rounded-xl border border-rose-100">
                    <div id="p2-title" class="text-xs font-semibold text-rose-600 uppercase">Jogador O</div>
                    <div id="score-o" class="text-xl font-bold text-rose-800">0</div>
                </div>
            </div>

            <!-- Turno Atual -->
            <div id="turn-indicator" class="text-center font-semibold text-emerald-800 py-1 border-t border-emerald-50 mt-1 flex items-center justify-center gap-2">
                Turno do Jogador <span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded-md font-extrabold text-sm flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> X</span>
            </div>
        </div>

        <!-- Tabuleiro -->
        <div class="bg-emerald-800/20 p-4 rounded-3xl shadow-xl border border-white/50 w-full aspect-square max-w-[360px] md:max-w-[400px]">
            <div class="grid grid-cols-3 gap-3 h-full w-full">
                <!-- Células do Tabuleiro -->
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="0"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="1"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="2"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="3"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="4"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="5"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="6"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="7"></button>
                <button class="grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm" data-index="8"></button>
            </div>
        </div>

        <!-- Botão de Reiniciar Rodada -->
        <button id="btn-restart" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
            <i data-lucide="rotate-ccw" class="w-5 h-5"></i> Reiniciar Partida
        </button>

    </main>

    <!-- Modal de Resultado -->
    <div id="result-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl p-6 shadow-2xl max-w-sm w-full text-center border border-emerald-100 flex flex-col items-center gap-4">
            <div id="result-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center bg-emerald-100">
                <i id="result-icon" data-lucide="trophy" class="w-8 h-8 text-emerald-600"></i>
            </div>
            <h2 id="result-title" class="text-2xl font-extrabold text-emerald-800">Temos um Vencedor!</h2>
            <p id="result-message" class="text-emerald-700 font-medium">O jogador X venceu esta rodada!</p>
            <button id="btn-close-modal" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-colors">
                Próxima Rodada
            </button>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="text-emerald-800/60 text-xs font-semibold mt-6 mb-2">
        Criado com HTML, CSS e Vanilla JS
    </footer>

    <script>
        // Inicialização dos ícones do Lucide
        lucide.createIcons();

        // Variáveis de Estado do Jogo
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X"; // X sempre começa
        let isGameActive = true;
        let gameMode = "pvp"; // 'pvp' ou 'ai'
        
        let scoreX = 0;
        let scoreO = 0;
        let scoreTies = 0;

        // Combinações de vitória possíveis no Jogo da Velha
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontais
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Verticais
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        // Elementos do DOM
        const cells = document.querySelectorAll(".grid-cell");
        const turnIndicator = document.getElementById("turn-indicator");
        const btnPvp = document.getElementById("btn-pvp");
        const btnAi = document.getElementById("btn-ai");
        const btnRestart = document.getElementById("btn-restart");
        const p2Title = document.getElementById("p2-title");
        
        // Placar
        const scoreXEl = document.getElementById("score-x");
        const scoreOEl = document.getElementById("score-o");
        const scoreTiesEl = document.getElementById("score-ties");

        // Modal
        const resultModal = document.getElementById("result-modal");
        const resultTitle = document.getElementById("result-title");
        const resultMessage = document.getElementById("result-message");
        const btnCloseModal = document.getElementById("btn-close-modal");
        const resultIconContainer = document.getElementById("result-icon-container");

        // Gerador de Som com Web Audio API para feedback sonoro imersivo
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime); // Nota Lá
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1, 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2, 0.1); // G5
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'tie') {
                    osc.frequency.setValueAtTime(220, ctx.currentTime); // Nota grave
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                // Navegador bloqueou áudio ou não suporta
            }
        };

        // Atualiza o indicador visual do turno atual
        function updateTurnIndicator() {
            if (currentPlayer === "X") {
                turnIndicator.innerHTML = `Turno do Jogador <span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded-md font-extrabold text-sm flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> X</span>`;
            } else {
                const label = gameMode === "ai" ? "IA" : "O";
                const colorClass = gameMode === "ai" ? "bg-purple-100 text-purple-800" : "bg-rose-100 text-rose-800";
                const dotClass = gameMode === "ai" ? "bg-purple-500" : "bg-rose-500";
                turnIndicator.innerHTML = `Turno do Jogador <span class="px-2 py-0.5 ${colorClass} rounded-md font-extrabold text-sm flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full ${dotClass}"></span> ${label}</span>`;
            }
        }

        // Trata o clique do jogador numa célula
        function handleCellClick(event) {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // Verifica se a célula está ocupada ou o jogo acabou ou é a vez da IA jogar
            if (board[clickedCellIndex] !== "" || !isGameActive) {
                return;
            }

            if (gameMode === "ai" && currentPlayer === "O") {
                return; // Impede clique enquanto a IA pensa/joga
            }

            makeMove(clickedCellIndex, currentPlayer);
            playSound('click');
            checkResult();
        }

        // Executa visualmente e na lógica o movimento de um jogador
        function makeMove(index, player) {
            board[index] = player;
            const cell = cells[index];
            cell.classList.add("occupied");

            if (player === "X") {
                cell.innerHTML = `<span class="text-blue-600 scale-90 inline-block transition-transform duration-150">X</span>`;
            } else {
                const colorClass = gameMode === "ai" ? "text-purple-600" : "text-rose-600";
                cell.innerHTML = `<span class="${colorClass} scale-90 inline-block transition-transform duration-150">O</span>`;
            }
        }

        // Verifica o estado atual do tabuleiro para decidir vencedor, velha ou continuação
        function checkResult() {
            let roundWon = false;
            let winningLine = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = board[winCondition[0]];
                let b = board[winCondition[1]];
                let c = board[winCondition[2]];

                if (a === '' || b === '' || c === '') {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    winningLine = winCondition;
                    break;
                }
            }

            if (roundWon) {
                isGameActive = false;
                highlightWinningCells(winningLine);
                setTimeout(() => {
                    announceWinner(currentPlayer);
                }, 600);
                return;
            }

            // Empate (Velha) se não houver mais espaços em branco
            let roundDraw = !board.includes("");
            if (roundDraw) {
                isGameActive = false;
                setTimeout(() => {
                    announceDraw();
                }, 300);
                return;
            }

            // Alterna jogador
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateTurnIndicator();

            // Se for modo IA e for o turno dela
            if (gameMode === "ai" && currentPlayer === "O" && isGameActive) {
                setTimeout(makeAIMove, 600); // delay realista para simular "pensamento"
            }
        }

        // Destaca visualmente a linha ganhadora
        function highlightWinningCells(line) {
            line.forEach(index => {
                cells[index].classList.add("winning-cell");
            });
        }

        // Mostra modal de Vencedor
        function announceWinner(winner) {
            playSound('win');
            if (winner === "X") {
                scoreX++;
                scoreXEl.textContent = scoreX;
                resultTitle.textContent = "Vitória do X!";
                resultMessage.textContent = "O Jogador X superou seu oponente com maestria nesta rodada.";
                resultIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center bg-blue-100";
                resultIconContainer.innerHTML = `<i id="result-icon" data-lucide="trophy" class="w-8 h-8 text-blue-600"></i>`;
            } else {
                scoreO++;
                scoreOEl.textContent = scoreO;
                if (gameMode === "ai") {
                    resultTitle.textContent = "Vitória da IA!";
                    resultMessage.textContent = "A Inteligência Artificial levou a melhor dessa vez!";
                    resultIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center bg-purple-100";
                    resultIconContainer.innerHTML = `<i id="result-icon" data-lucide="cpu" class="w-8 h-8 text-purple-600"></i>`;
                } else {
                    resultTitle.textContent = "Vitória do O!";
                    resultMessage.textContent = "O Jogador O conquistou a vitória com excelentes estratégias.";
                    resultIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center bg-rose-100";
                    resultIconContainer.innerHTML = `<i id="result-icon" data-lucide="trophy" class="w-8 h-8 text-rose-600"></i>`;
                }
            }
            lucide.createIcons();
            resultModal.classList.remove("hidden");
        }

        // Mostra modal de Empate (Velha)
        function announceDraw() {
            playSound('tie');
            scoreTies++;
            scoreTiesEl.textContent = scoreTies;
            resultTitle.textContent = "Deu Velha!";
            resultMessage.textContent = "Tudo igual! Um belo equilíbrio tático de ambos os lados.";
            resultIconContainer.className = "w-16 h-16 rounded-full flex items-center justify-center bg-gray-100";
            resultIconContainer.innerHTML = `<i id="result-icon" data-lucide="scale" class="w-8 h-8 text-gray-500"></i>`;
            lucide.createIcons();
            resultModal.classList.remove("hidden");
        }

        // Lógica de Movimento da IA (Minimax para ser imbatível)
        function makeAIMove() {
            if (!isGameActive) return;

            let bestScore = -Infinity;
            let move;

            // Percorre todas as posições livres e simula a jogada
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    let score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) {
                        bestScore = score;
                        move = i;
                    }
                }
            }

            // Realiza a jogada escolhida
            makeMove(move, "O");
            playSound('click');
            checkResult();
        }

        // Algoritmo Minimax para o Jogo da Velha inteligente
        function minimax(tempBoard, depth, isMaximizing) {
            let result = evaluateBoard(tempBoard);
            if (result !== null) {
                return result;
            }

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (tempBoard[i] === "") {
                        tempBoard[i] = "O";
                        let score = minimax(tempBoard, depth + 1, false);
                        tempBoard[i] = "";
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (tempBoard[i] === "") {
                        tempBoard[i] = "X";
                        let score = minimax(tempBoard, depth + 1, true);
                        tempBoard[i] = "";
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        // Função de utilidade para o Minimax
        function evaluateBoard(tempBoard) {
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (tempBoard[a] !== "" && tempBoard[a] === tempBoard[b] && tempBoard[b] === tempBoard[c]) {
                    return tempBoard[a] === "O" ? 10 : -10;
                }
            }
            if (!tempBoard.includes("")) {
                return 0; // Empate
            }
            return null; // Jogo ainda ocorrendo
        }

        // Reinicia o tabuleiro, mantendo as pontuações atuais intactas
        function restartBoard() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            
            cells.forEach(cell => {
                cell.innerHTML = "";
                cell.className = "grid-cell bg-white/90 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-extrabold shadow-sm";
            });

            updateTurnIndicator();
            resultModal.classList.add("hidden");
        }

        // Reinicia tudo (incluindo placar e muda o modo de jogo)
        function changeGameMode(mode) {
            gameMode = mode;
            scoreX = 0;
            scoreO = 0;
            scoreTies = 0;
            
            scoreXEl.textContent = "0";
            scoreOEl.textContent = "0";
            scoreTiesEl.textContent = "0";

            if (mode === "ai") {
                btnAi.classList.add("bg-white", "shadow", "text-emerald-800");
                btnAi.classList.remove("text-emerald-700");
                btnPvp.classList.remove("bg-white", "shadow", "text-emerald-800");
                btnPvp.classList.add("text-emerald-700");
                p2Title.textContent = "IA (O)";
                p2Title.className = "text-xs font-semibold text-purple-600 uppercase";
            } else {
                btnPvp.classList.add("bg-white", "shadow", "text-emerald-800");
                btnPvp.classList.remove("text-emerald-700");
                btnAi.classList.remove("bg-white", "shadow", "text-emerald-800");
                btnAi.classList.add("text-emerald-700");
                p2Title.textContent = "Jogador O";
                p2Title.className = "text-xs font-semibold text-rose-600 uppercase";
            }

            restartBoard();
        }

        // Event Listeners
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        btnPvp.addEventListener('click', () => changeGameMode('pvp'));
        btnAi.addEventListener('click', () => changeGameMode('ai'));
        btnRestart.addEventListener('click', restartBoard);
        btnCloseModal.addEventListener('click', restartBoard);
    </script>
</body>
</html>
